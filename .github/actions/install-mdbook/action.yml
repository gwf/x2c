name: Install mdBook
description: Put the pinned Linux x86_64 mdBook release on PATH.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MDBOOK_VERSION: 0.5.4
        MDBOOK_SHA256: >-
          3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
      run: |
        release="https://github.com/rust-lang/mdBook/releases/download"
        file="mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
        archive="$RUNNER_TEMP/mdbook.tar.gz"
        curl -fsSL "$release/v$MDBOOK_VERSION/$file" -o "$archive"
        echo "$MDBOOK_SHA256  $archive" | sha256sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
