name: stage website only
on:
  workflow_call:
    inputs:
      update_book:
        type: boolean
        default: false
      source_sha:
        required: true
        type: string
      expected_output:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  website:
    runs-on: ubuntu-24.04
    environment: staging-publication
    env:
      SITE_SOURCE_REF: ${{ inputs.source_sha }}
      SITE_RELEASE_CHANNEL: staging
      SITE_URL: https://staging.x2c-lang.dev
      SITE_BASE: /
      PLAYGROUND_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: gwf/x2c-staging
          ref: ${{ inputs.expected_output }}
          path: staged
          persist-credentials: false
      - name: Select website and retained release
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source fetch origin dev
          git -C source merge-base --is-ancestor "$SOURCE_SHA" origin/dev
          python3 - <<'PY'
          import json, os
          release = json.load(open('staged/public/release-candidate.json'))
          assert release['destination'] == 'staging'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SITE_STAGED_SOURCE_REF=' + release['source_sha'] + '\n')
              env.write('SITE_CANDIDATE_ID=' + release['identity'] + '\n')
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/site/package-lock.json
      - uses: ./trusted/.github/actions/install-mdbook
      - name: Install website dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libx11-dev
          command -v clang
          curl -fsSL --retry 3 \
            https://github.com/AlDanial/cloc/releases/download/v2.06/cloc-2.06.pl \
            -o "$RUNNER_TEMP/cloc"
          echo "ed9fbdd081a2ceb933ea490b3c1cfacc87d3898ae2650d0d6756439695a836c8  $RUNNER_TEMP/cloc" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cloc"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          npm ci --prefix source/site
          (cd source/site && npx playwright install --with-deps chromium)
      - uses: ./trusted/.github/actions/select-clang
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.13
      # The selected source may predate the site build that makes the wasm
      # runtime itself; the explicit step keeps such a source buildable.
      - name: Build compiler and WebAssembly runtime for website examples
        run: |
          make -C source build-safe
          make -C source wasm-runtime
      - name: Build complete runnable website
        run: npm --prefix source/site run build
      - name: Install pinned PDF tools
        if: inputs.update_book
        env:
          PANDOC_SHA256: 67d7d011fed8c8543306022b985b9b2499ab9b74818df91d8727c7e9ebc5ba06
          TYPST_SHA256: 59b207df01be2dab9f13e80f73d04d7ff8273ffd46b3dd1b9eef5c60f3eeabea
        run: |
          curl -fsSL https://github.com/jgm/pandoc/releases/download/3.12/pandoc-3.12-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/pandoc.tar.gz"
          echo "$PANDOC_SHA256  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz \
            -o "$RUNNER_TEMP/typst.tar.xz"
          echo "$TYPST_SHA256  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.12/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Typeset the complete book at selected source
        if: inputs.update_book
        run: make -C source doc-pdf
      - name: Copy rebuilt staging book
        if: inputs.update_book
        run: cp source/docs/x2c-book.pdf source/site/dist/x2c-book.pdf
      - name: Retain staged release and check site
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 trusted/etc/release/prepare-website.py \
            --site source/site/dist --staged staged/public \
            --source-sha "$SOURCE_SHA" --output prepared/site-staging.tar.gz \
            ${{ inputs.update_book && '--update-book' || '' }}
          cd source
          node site/scripts/check-built-site.mjs
      - uses: actions/create-github-app-token@v2
        id: staging-token
        with:
          app-id: ${{ vars.STAGING_APP_ID }}
          private-key: ${{ secrets.STAGING_APP_PRIVATE_KEY }}
          owner: gwf
          repositories: x2c-staging
      - name: Deploy website through staging Pages
        env:
          GH_TOKEN: ${{ steps.staging-token.outputs.token }}
          EXPECTED_OUTPUT: ${{ inputs.expected_output }}
        run: |
          python3 trusted/etc/release/deploy-staging.py \
            --site-archive prepared/site-staging.tar.gz \
            --expected-output "$EXPECTED_OUTPUT"
      - name: Verify live website and retained release files
        run: python3 trusted/etc/release/verify-website.py --site source/site/dist
      # The same source is then built for production and kept, so that
      # promotion deploys this archive without building.
      - name: Fetch the release production serves
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          curl -fsSL --retry 3 https://x2c-lang.dev/release-candidate.json \
            -o production-release.json
          read -r version released < <(python3 -c 'import json
          release = json.load(open("production-release.json"))
          print(release["version"], release["source_sha"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$released" =~ ^[0-9a-f]{40}$ ]]
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
            --pattern site-production.tar.gz --dir released
          mkdir released/public
          tar -xzf released/site-production.tar.gz -C released/public
          cmp production-release.json released/public/release-candidate.json
          echo "PRODUCTION_SOURCE_REF=$released" >> "$GITHUB_ENV"
          git -C source fetch origin "$released"
          {
            echo "### Book files changed since production release $version"
            echo '```'
            git -C source diff --stat "$released" "$SOURCE_SHA" -- docs/src
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and keep the production website at the same source
        env:
          SITE_RELEASE_CHANNEL: production
          SITE_URL: https://x2c-lang.dev
          SITE_STAGED_SOURCE_REF: ${{ env.PRODUCTION_SOURCE_REF }}
          SITE_CANDIDATE_ID: ""
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          npm --prefix source/site run build
          python3 trusted/etc/release/prepare-website.py \
            --site source/site/dist --staged released/public \
            --source-sha "$SOURCE_SHA" --destination production \
            --output production/site-production.tar.gz
          cd source
          node site/scripts/check-built-site.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: website-production
          path: production
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-staging
          path: prepared
