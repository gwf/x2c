name: release-validation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CC: clang

jobs:
  installation-and-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang make python3 git unzip autoconf automake libtool pkg-config perl diffutils
      - name: Select Clang host preprocessor
        run: |
          mkdir -p "$RUNNER_TEMP/x2c-clang"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/x2c-clang/cc"
          echo "$RUNNER_TEMP/x2c-clang" >> "$GITHUB_PATH"
      - name: Build from checked-in bootstrap
        run: make build-safe
      - name: Run all ordinary examples and gallery assertions
        run: make examples
      - name: Prepare the documentation sample dependency
        run: make -C packages/pcre2 build
      - name: Compile documentation examples
        run: make doc-examples
      - name: Build the portable executable
        run: make ape-build
      - name: Install outside checkout and verify native self-rebuild
        run: make ape-verify

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: pcre2
            targets: test run run-lisp
          - package: yyjson
            targets: test run run-lisp
          - package: libcurl
            targets: test run run-lisp
          - package: termbox2
            targets: test run
          - package: blis
            targets: test run
          - package: libuv
            targets: test run
          - package: raylib
            targets: verify
    steps:
      - uses: actions/checkout@v5
      - name: Install build and runtime test tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang python3 git autoconf automake libtool pkg-config perl expect jq file patch ca-certificates unzip diffutils
      - name: Select Clang host preprocessor
        run: |
          mkdir -p "$RUNNER_TEMP/x2c-clang"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/x2c-clang/cc"
          echo "$RUNNER_TEMP/x2c-clang" >> "$GITHUB_PATH"
      - name: Build from checked-in bootstrap
        run: make build-safe
      - name: Prepare fresh dependency and run package tests and examples
        run: make -C packages/${{ matrix.package }} ${{ matrix.targets }}
      - name: Run HTTP and JSON composition
        if: matrix.package == 'libcurl'
        run: make -C examples/packages/http-json-releases test
