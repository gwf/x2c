name: release-validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-repl-investigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Probe GNU linker dependencies
        run: bash tools/one-time-linux-repl-probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-repl-investigation
          path: |
            /tmp/x2c-linux-repl.*/repl.log
            /tmp/x2c-linux-repl.*/link-trace.log
            debug/repl-probe-bootstrap.log
