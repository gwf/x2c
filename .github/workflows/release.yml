# Advisory and tag-driven. A `v<version>` tag builds the release tarball and
# the package bundles on every supported platform, publishes them as release
# assets with the package index, points the site at the new version, and
# deploys the site. It is not part of the local development, build, PR, or
# commit process and must never be a required status check. A manual run
# performs the builds and keeps the results as workflow artifacts only.
#
# The runner images are pinned rather than tracking `-latest`: a published
# executable carries the deployment target and C library of the machine that
# built it, so moving to a newer image would quietly raise the oldest macOS
# and Linux a release runs on.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CC: clang

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y clang make python3 git diffutils
            mkdir -p "$RUNNER_TEMP/x2c-clang"
            ln -s "$(command -v clang)" "$RUNNER_TEMP/x2c-clang/cc"
            echo "$RUNNER_TEMP/x2c-clang" >> "$GITHUB_PATH"
          fi
      - name: Build from checked-in bootstrap
        run: make build-safe
      - name: Check that the compiler version matches the tag
        if: github.ref_type == 'tag'
        run: |
          version="$(builds/0/x2c --version | cut -d' ' -f2)"
          [ "v$version" = "$GITHUB_REF_NAME" ] ||
            { echo "tag $GITHUB_REF_NAME but x2c $version" >&2; exit 1; }
      - name: Build the release tarball and check the install script
        run: tools/check-install-script.sh
      - name: Keep the release tarball
        uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.os }}
          path: |
            dist/x2c-*.tar.gz
            dist/x2c-*.tar.gz.sha256

  bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
        package: [pcre2, yyjson, libcurl, termbox2, libuv, blis]
        # Upstream publishes prebuilt CPU libtorch only for these two.
        include:
          - os: macos-15
            package: torch
          - os: ubuntu-24.04
            package: torch
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential clang python3 git \
              autoconf automake libtool pkg-config perl jq file patch \
              ca-certificates unzip diffutils
            mkdir -p "$RUNNER_TEMP/x2c-clang"
            ln -s "$(command -v clang)" "$RUNNER_TEMP/x2c-clang/cc"
            echo "$RUNNER_TEMP/x2c-clang" >> "$GITHUB_PATH"
          else
            brew install autoconf automake libtool pkg-config jq
          fi
      - name: Build from checked-in bootstrap
        run: make build-safe
      - name: Bundle the package for this platform
        run: make -C packages/${{ matrix.package }} bundle
      # torch carries shared libraries, so its bundle is only proven by a
      # program that loads them from an installed copy.
      - name: Run a program against the installed torch bundle
        if: matrix.package == 'torch'
        run: |
          packages/tools/check-bundle.sh \
            packages/torch/builds/bundle/torch-native.tar.gz \
            packages/torch/examples/fit-line.x
      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.package }}-${{ matrix.os }}
          path: packages/${{ matrix.package }}/builds/bundle/*-native.tar.gz

  # Publishing waits for every tarball and every bundle. A partial run would
  # replace the live index with one that silently drops packages, so a failed
  # bundle holds the release until the tag is re-run.
  publish:
    needs: [compiler, bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Collect the built assets
        uses: actions/download-artifact@v8
        with:
          path: built
      - name: Assemble the release directory and package index
        run: |
          mkdir -p release
          cp built/compiler-*/x2c-*.tar.gz \
            built/compiler-*/x2c-*.tar.gz.sha256 release/
          # Every platform must have produced the same version.
          version="$(ls release/x2c-*.tar.gz |
            sed 's|release/x2c-\(.*\)-[^-]*-[^-]*\.tar\.gz|\1|' |
            sort -u | paste -sd ' ' -)"
          case "$version" in
            *" "*|"") echo "tarball versions disagree: $version" >&2; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          find built -path 'built/bundle-*' -name '*-native.tar.gz' \
            >bundles.txt
          [ -s bundles.txt ] || { echo "no package bundles" >&2; exit 1; }
          # The index script runs on the Linux compiler this release built.
          mkdir -p "$RUNNER_TEMP/x2c-release"
          tar -xzf "release/x2c-$version-linux-$(uname -m).tar.gz" \
            -C "$RUNNER_TEMP/x2c-release"
          x2c="$(echo "$RUNNER_TEMP"/x2c-release/*/bin/x2c)"
          xargs "$x2c" script tools/gen-package-index.x --output release \
            --base "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version" \
            --x2c-version "x2c $version" \
            --package-dir examples/packages --package-dir packages <bundles.txt
          (cd release && sha256sum -- * >SHA256SUMS)
          ls -l release
          cat release/index.txt
      - name: Keep the assembled release
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release
      - name: Publish the release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          [ "$tag" = "v$VERSION" ] ||
            { echo "tag $tag but the tarballs carry $VERSION" >&2; exit 1; }
          printf '%s\n' 'Install or upgrade:' '' '```sh' \
            'curl -fsSL https://x2c-lang.dev/install.sh | sh' '```' \
            >notes.md
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --verify-tag \
              --title "x2c $VERSION" --notes-file notes.md
          gh release upload "$tag" release/* --clobber
      - name: Point the site at the release and deploy it
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth 1 origin main:refs/remotes/origin/main
          git switch -C main refs/remotes/origin/main
          printf '%s\n' "$VERSION" > site/public/x2c-version.txt
          cp release/index.txt site/public/packages/index.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/x2c-version.txt site/public/packages/index.txt
          if git diff --cached --quiet; then
            echo "site already points at $VERSION"
          else
            git commit -m "point the site at x2c $VERSION"
            for attempt in 1 2 3 4 5; do
              git push origin HEAD:refs/heads/main && break
              git pull --rebase origin main
              [ "$attempt" != 5 ] || exit 1
            done
          fi
          gh workflow run pages.yml --ref main
