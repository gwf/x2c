# Gary advances main and creates the annotated tag before dispatch.
# This workflow never builds compiler/package/site output or modifies branches.
name: promote verified candidate
on:
  workflow_dispatch:
    inputs:
      identity:
        description: Exact verified staging candidate selected by Gary
        required: true
        type: string
      expected_version:
        description: Current production site version (guard against stale selection)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production-publication
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fetch and check the selected verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ inputs.identity }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 tools/release-candidate.py fetch \
            --repository gwf/x2c-staging --identity "$IDENTITY" --output candidate
          python3 tools/release-candidate.py verify \
            --candidate candidate --require-staging
          python3 tools/release-candidate.py guard --candidate candidate
          python3 - <<'PY'
          import os
          from urllib.request import urlopen
          current = urlopen('https://x2c-lang.dev/x2c-version.txt').read().decode().strip()
          assert current == os.environ['EXPECTED_VERSION'], 'production site changed'
          PY
      - name: Upload exact tested bytes and expose complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release-candidate.py publish --candidate candidate \
            --repository gwf/x2c --destination production
          version="$(python3 -c 'import json; print(json.load(open("candidate/candidate.json"))["version"])')"
          gh release edit "v$version" --repo gwf/x2c --draft=false --latest
      - name: Keep the exact production site for Pages
        uses: actions/upload-artifact@v7
        with:
          name: production-site
          path: |
            candidate/site-production.tar.gz
            candidate/site-production.json
            candidate/candidate.json
          retention-days: 30
  pages:
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: production-site
          path: candidate
      - name: Verify and extract the retained site
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          root = pathlib.Path('candidate')
          archive = root / 'site-production.tar.gz'
          receipt = json.loads((root / 'site-production.json').read_text())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == receipt['sha256']
          assert hashlib.sha256((root / 'candidate.json').read_bytes()).hexdigest() == receipt['manifest_sha256']
          with tarfile.open(archive) as tar:
            for member in tar.getmembers():
              path = pathlib.Path(member.name)
              assert not path.is_absolute() and '..' not in path.parts
              assert member.isfile() or member.isdir()
            tar.extractall('public', filter='data')
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
  verify:
    needs: pages
    uses: ./.github/workflows/verify.yml
    with:
      identity: ${{ inputs.identity }}
      destination: production
  record:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production-publication
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Retain completed production verification
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ inputs.identity }}
        run: |
          python3 tools/release-candidate.py fetch \
            --repository gwf/x2c-staging --identity "$IDENTITY" --output candidate
          python3 tools/release-candidate.py receipt --candidate candidate \
            --destination production \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 tools/release-candidate.py publish --candidate candidate \
            --repository gwf/x2c --destination production
