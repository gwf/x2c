# Temporary. Checks whether GNU Make 4 clears the byte loss that Apple's
# make 3.81 shows on macOS x86_64. Delete before the pull request.
name: platform-probe

on:
  push:
    branches:
      - claude/package-platform-coverage

permissions:
  contents: read

env:
  CC: clang

jobs:
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config jq make
      - name: Show both makes
        run: |
          make --version | head -1
          gmake --version | head -1
      - name: Build from checked-in bootstrap
        run: make build-safe
      - name: libuv licenses under Apple make
        continue-on-error: true
        run: make -C packages/libuv verify-licenses && echo PASS-apple-libuv
      - name: libuv licenses under GNU make 4
        continue-on-error: true
        run: gmake -C packages/libuv verify-licenses && echo PASS-gnu-libuv
      - name: blis profile under GNU make 4
        continue-on-error: true
        run: gmake -C packages/blis verify-profile && echo PASS-gnu-blis
      - name: libcurl profile under GNU make 4
        continue-on-error: true
        run: gmake -C packages/libcurl verify-profile && echo PASS-gnu-libcurl
      - name: full libuv bundle under GNU make 4
        continue-on-error: true
        run: gmake -C packages/libuv bundle && echo PASS-gnu-libuv-bundle
