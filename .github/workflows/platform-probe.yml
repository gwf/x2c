# Temporary. Compares recipe forms for a pinned digest on macOS x86_64,
# where the current form loses bytes. Delete before the pull request.
name: platform-probe

on:
  push:
    branches:
      - claude/package-platform-coverage

permissions:
  contents: read

env:
  CC: clang

jobs:
  forms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Try each recipe form
        run: |
          cd packages/libuv
          cat >/tmp/Forms.mk <<'MK'
          SUM := 16de0c32b265cb7d46a6d3bd614f259dd4d693a5e26b3407b04aae8d73041f0c
          FILE := LICENSES/libuv-1.52.1-MIT.txt

          continued:
          	@test "$$(shasum -a 256 $(FILE) | \
          	  cut -d' ' -f1)" = \
          	  16de0c32b265cb7d46a6d3bd614f259dd4d693a5e26b3407b04aae8d73041f0c

          variable:
          	@test "$$(shasum -a 256 $(FILE) | \
          	  cut -d' ' -f1)" = "$(SUM)"

          oneline:
          	@test "$$(shasum -a 256 $(FILE) | cut -d' ' -f1)" = "$(SUM)"

          checkfile:
          	@printf '%s  %s\n' "$(SUM)" "$(FILE)" | shasum -a 256 -c --status
          MK
          sed -i '' 's/^          //' /tmp/Forms.mk
          for form in continued variable oneline checkfile; do
            if make -f /tmp/Forms.mk "$form" 2>/dev/null; then
              echo "PASS $form"
            else
              echo "FAIL $form"
            fi
          done
