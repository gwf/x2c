# Temporary. Captures the failing recipes to files so the live log cannot
# interleave their traces. Delete before the pull request.
name: platform-probe

on:
  push:
    branches:
      - claude/package-platform-coverage

permissions:
  contents: read

env:
  CC: clang

jobs:
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config jq
      - name: Show the tools the recipes run under
        run: |
          make --version | head -1
          /bin/sh --version 2>&1 | head -1 || true
          command -v shasum nm ar jq
      - name: Build from checked-in bootstrap
        run: make build-safe
      - name: Trace the libuv license check
        continue-on-error: true
        run: |
          make -C packages/libuv SHELL='sh -x' verify-licenses \
            >"$RUNNER_TEMP/libuv.log" 2>&1 || true
          cat "$RUNNER_TEMP/libuv.log"
      - name: Trace the libcurl profile check
        continue-on-error: true
        run: |
          make -C packages/libcurl SHELL='sh -x' verify-profile \
            >"$RUNNER_TEMP/libcurl.log" 2>&1 || true
          tail -60 "$RUNNER_TEMP/libcurl.log"
      - name: Trace the blis profile check
        continue-on-error: true
        run: |
          make -C packages/blis SHELL='sh -x' verify-profile \
            >"$RUNNER_TEMP/blis.log" 2>&1 || true
          tail -60 "$RUNNER_TEMP/blis.log"
