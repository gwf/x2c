# Temporary. Compares every pinned digest against the checkout on macOS
# x86_64, one line at a time. Delete before the pull request.
name: platform-probe

on:
  push:
    branches:
      - claude/package-platform-coverage

permissions:
  contents: read

env:
  CC: clang

jobs:
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Compare every pinned license digest with the checkout
        run: |
          git status --porcelain
          git config --get core.autocrlf || echo "autocrlf unset"
          for f in packages/libuv/LICENSES/*.txt packages/blis/LICENSES/*.txt; do
            printf '%s  %s  %s bytes\n' \
              "$(shasum -a 256 "$f" | cut -d' ' -f1)" "$f" \
              "$(wc -c <"$f" | tr -d ' ')"
          done
          echo "--- literals the makefiles expect ---"
          grep -hoE '^	  [0-9a-f]{64}$' packages/libuv/Makefile \
            packages/blis/Makefile | tr -d '\t '
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config jq
      - name: Build from checked-in bootstrap
        run: make build-safe
      - name: Run the libuv license check alone
        continue-on-error: true
        run: make -C packages/libuv verify-licenses && echo "libuv licenses ok"
      - name: Run the libcurl profile check with a trace
        continue-on-error: true
        run: make -C packages/libcurl SHELL='sh -x' verify-profile 2>&1 | tail -40
      - name: Run the blis profile check with a trace
        continue-on-error: true
        run: make -C packages/blis SHELL='sh -x' verify-profile 2>&1 | tail -40
