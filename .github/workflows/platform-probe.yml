# Temporary. Uploads the failing recipes' traces as an artifact, because the
# live log is not byte-exact. Delete before the pull request.
name: platform-probe

on:
  push:
    branches:
      - claude/package-platform-coverage

permissions:
  contents: read

env:
  CC: clang

jobs:
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config jq
      - name: Build from checked-in bootstrap
        run: make build-safe
      - name: Collect the failing recipes
        run: |
          out="$RUNNER_TEMP/probe"
          mkdir -p "$out"
          make --version >"$out/tools.txt" 2>&1
          command -v shasum nm ar jq make >>"$out/tools.txt" 2>&1
          sed -n '60,80p' packages/libuv/Makefile | od -c >"$out/makefile.txt"
          (cd packages/libuv && shasum -a 256 LICENSES/*.txt) \
            >"$out/digests.txt" 2>&1
          make -C packages/libuv SHELL='sh -x' verify-licenses \
            >"$out/libuv.txt" 2>&1 || echo "exit $?" >>"$out/libuv.txt"
          make -C packages/libcurl SHELL='sh -x' verify-profile \
            >"$out/libcurl.txt" 2>&1 || echo "exit $?" >>"$out/libcurl.txt"
          make -C packages/blis SHELL='sh -x' verify-profile \
            >"$out/blis.txt" 2>&1 || echo "exit $?" >>"$out/blis.txt"
      - name: Keep the traces
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: ${{ runner.temp }}/probe
