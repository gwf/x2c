# Temporary. Traces the macOS x86_64 verification failures that survive the
# include fix. Delete before the pull request.
name: platform-probe

on:
  push:
    branches:
      - claude/package-platform-coverage

permissions:
  contents: read

env:
  CC: clang

jobs:
  intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Show the checksum tool before brew
        run: |
          command -v shasum; shasum --version || true
          shasum -a 256 packages/libuv/LICENSES/libuv-1.52.1-MIT.txt
      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config jq
      - name: Show the checksum tool after brew
        run: |
          command -v shasum; shasum --version || true
          shasum -a 256 packages/libuv/LICENSES/libuv-1.52.1-MIT.txt
          echo "PATH=$PATH"
      - name: Build from checked-in bootstrap
        run: make build-safe
      - name: Trace the libuv license check
        continue-on-error: true
        run: make -C packages/libuv SHELL='sh -x' verify-licenses
      - name: Trace the libcurl profile check
        continue-on-error: true
        run: make -C packages/libcurl SHELL='sh -x' verify-profile
      - name: Trace the blis profile check
        continue-on-error: true
        run: make -C packages/blis SHELL='sh -x' verify-profile
