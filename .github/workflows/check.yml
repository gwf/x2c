# Advisory and manual only. This workflow is an optional Linux/clang signal;
# it is not part of the local development, build, PR, or commit process. It
# must never be configured as a required status check. `make check` and
# `make precommit` are the offline gates that matter.
name: check

on:
  workflow_dispatch:
    inputs:
      release_validation:
        description: Also run installation, examples, and fresh package validation
        type: boolean
        default: false
      windows_spike:
        description: Also probe Windows install routes (WSL2 check, MSYS2 build attempt)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CC: clang

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Select Clang host preprocessor
        run: |
          mkdir -p "$RUNNER_TEMP/x2c-clang"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/x2c-clang/cc"
          echo "$RUNNER_TEMP/x2c-clang" >> "$GITHUB_PATH"
      - name: Build trusted stage zero
        run: make build-safe
      - name: Run complete non-mutating gate
        run: make check

  sanitizer-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Select Clang host preprocessor
        run: |
          mkdir -p "$RUNNER_TEMP/x2c-clang"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/x2c-clang/cc"
          echo "$RUNNER_TEMP/x2c-clang" >> "$GITHUB_PATH"
      - name: Build trusted stage zero
        run: make build-safe
      - name: Run leak-enabled sanitizer gate
        run: X2C_DETECT_LEAKS=1 make verify-sanitize

  release-validation:
    if: inputs.release_validation
    uses: ./.github/workflows/release-validation.yml

  # Windows probes for the install story: the supported WSL2 route checked
  # end to end with the install script, and a build attempt under the MSYS2
  # POSIX layer that reports how far it gets. Advisory only.
  wsl-install:
    if: inputs.windows_spike
    runs-on: windows-latest
    steps:
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
          additional-packages: clang make python3 curl git ca-certificates
      - name: Build from a Linux-filesystem clone and check the install script
        shell: wsl-bash {0}
        # The WSL shell does not receive the step's env, so values are inlined.
        run: |
          set -eu
          mkdir -p /tmp/x2c-clang
          ln -sf "$(command -v clang)" /tmp/x2c-clang/cc
          export PATH="/tmp/x2c-clang:$PATH"
          git clone --quiet --depth 1 --branch "${{ github.ref_name }}" \
            "https://github.com/${{ github.repository }}" "$HOME/x2c"
          cd "$HOME/x2c"
          mkdir -p debug
          make build-safe >debug/bootstrap.log 2>&1 || {
            tail -n 40 debug/bootstrap.log; exit 1; }
          tools/check-install-script.sh "$HOME/install-check"
          "$HOME/install-check/prefix/bin/x2c" env

  msys2-build:
    if: inputs.windows_spike
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: base-devel gcc python git
      - name: Report the toolchain
        run: |
          uname -a
          gcc --version | head -n 1
          make --version | head -n 1
          python3 --version
      - name: Attempt the bootstrap build
        continue-on-error: true
        run: |
          mkdir -p debug
          export CC=gcc AR=ar X2C_CC=gcc
          ./configure
          make build-safe >debug/bootstrap.log 2>&1 || {
            echo "build-safe failed; last 60 lines:"
            tail -n 60 debug/bootstrap.log
            exit 1
          }
          ./builds/0/x2c env
          ./builds/0/x2c run examples/foreach.x
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msys2-bootstrap-log
          path: debug/bootstrap.log
