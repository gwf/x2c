# Advisory and manual only. Two Windows probes for the install story: the
# supported WSL2 route, checked end to end with the install script, and a
# build attempt under the MSYS2 POSIX layer that reports how far it gets.
# Neither is a required check.
name: windows-spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl-install:
    runs-on: windows-latest
    steps:
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
          additional-packages: clang make python3 curl git ca-certificates
      - name: Build from a Linux-filesystem clone and check the install script
        shell: wsl-bash {0}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/x2c-clang"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/x2c-clang/cc"
          export PATH="$RUNNER_TEMP/x2c-clang:$PATH"
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY" "$HOME/x2c"
          cd "$HOME/x2c"
          mkdir -p debug
          make build-safe >debug/bootstrap.log 2>&1
          tools/check-install-script.sh "$HOME/install-check"
          "$HOME/install-check/prefix/bin/x2c" env
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNNER_TEMP: /tmp

  msys2-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: base-devel gcc python git
      - name: Report the toolchain
        run: |
          uname -a
          gcc --version | head -n 1
          make --version | head -n 1
          python3 --version
      - name: Attempt the bootstrap build
        continue-on-error: true
        run: |
          mkdir -p debug
          export CC=gcc AR=ar X2C_CC=gcc
          ./configure
          make build-safe >debug/bootstrap.log 2>&1 || {
            echo "build-safe failed; last 60 lines:"
            tail -n 60 debug/bootstrap.log
            exit 1
          }
          ./builds/0/x2c env
          ./builds/0/x2c run examples/foreach.x
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msys2-bootstrap-log
          path: debug/bootstrap.log
