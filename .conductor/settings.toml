"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[prompts]
create_pr = """
Inspect the outgoing diff against `dev` and use the publication command that
the root `AGENTS.md` assigns to that diff. For a documentation-only change,
run `tools/gate-state.py ensure doc-check`. For code publication, run
`tools/gate-state.py ensure agent-pr-check`. Each command reuses a valid
record or runs and records its corresponding existing Make target.

For a PR, `dev` is the base branch, not the push destination. Push the current
workspace branch to the same-named remote branch with an explicit refspec:

branch="$(git branch --show-current)"
git push -u origin "HEAD:refs/heads/$branch"
gh pr create --draft --base dev --head "$branch"

Do not use a source-only push such as `git push`, `git push origin <branch>`,
or `git push -u origin <branch>` for PR publication. Publishing directly to
`dev` requires separate explicit authorization.
"""
